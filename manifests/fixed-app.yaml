apiVersion: v1
kind: Namespace
metadata:
  name: k8sgpt-assignment
  labels:
    purpose: k8sgpt-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8sgpt-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: k8sgpt-assignment
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
